[project]
name = "coding-agent-sft-lab"
version = "0.1.0"
description = "A lightweight code-repository agent and SFT training pipeline for agentic coding experiments."
requires-python = ">=3.10"
dependencies = [
  "langgraph>=0.2.0",
  "openai>=1.0.0",
  "python-dotenv>=1.0.0",
  "typer>=0.12.0",
  "rich>=13.0.0",
]

[project.optional-dependencies]
data = [
  "datasets>=2.19.0",
]
rag = [
  "tree-sitter-language-pack",
]
sft = [
  "huggingface_hub>=0.23.0",
  "transformers>=4.40.0",
  "peft>=0.11.0",
  "torch>=2.1.0",
]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
cc-agent = "cc_agent.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
